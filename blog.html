  <body>
    <!-- Blog Header Section -->
    <div id="hero">

    <!-- Blog Posts Section -->
    <section id="blog-posts">
      <div class="container">
        <div class="blog-wrapper" id="blog-posts-container">
          <!-- Posts will be loaded here dynamically -->

    <!-- Footer Section -->

            rel="noopener noreferrer"

    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      // Function to parse frontmatter
      function parseFrontmatter(content) {
        const frontmatterRegex = /^---\n([\s\S]*?)\n---/;
        const match = content.match(frontmatterRegex);

        if (match) {
          const frontmatter = match[1];
          const metadata = {};

          frontmatter.split("\n").forEach((line) => {
            const [key, ...valueParts] = line.split(":");
            if (key && valueParts.length) {
              const value = valueParts.join(":").trim();
              metadata[key.trim()] = value.replace(/^["']|["']$/g, "");
            }
          });

          return {
            metadata,
            content: content.slice(match[0].length).trim(),
          };
        }

        return { metadata: {}, content };
      }

      // Function to load and render blog posts
      async function loadBlogPosts() {
        const container = document.getElementById("blog-posts-container");

        try {
          // Fetch the list of markdown files
          const response = await fetch("blog/posts/dsa-journey.md");
          const markdownContent = await response.text();

          // Parse frontmatter and content
          const { metadata, content: parsedContent } =
            parseFrontmatter(markdownContent);

          // Remove the first heading from the content if it matches the title
          const contentWithoutTitle = parsedContent
            .replace(/^#\s+.*$/m, "")
            .trim();

          // Convert markdown to HTML
          const htmlContent = marked.parse(contentWithoutTitle);

          // Create blog post element
          const article = document.createElement("article");
          article.className = "blog-post";

          // Add title and date
          article.innerHTML = `
            <button class="blog-post__expand" title="Expand to full screen">
              <i class="fas fa-expand"></i>
            </button>
            <div class="blog-post__content collapsed">
              <h1 class="blog-post__title">${metadata.title}</h1>
              <div class="blog-post__meta">
                <span class="blog-post__date">${metadata.date}</span>
                <span class="blog-post__author">By ${
                  metadata.author || "Nikhil Narra"
                }</span>
              </div>
              ${htmlContent}
            </div>
            <button class="blog-post__read-more">Read More</button>
            <button class="blog-post__close" style="display: none;">×</button>
          `;

          // Add click handler for the expand button
          const expandBtn = article.querySelector(".blog-post__expand");
          const readMoreBtn = article.querySelector(".blog-post__read-more");
          const closeBtn = article.querySelector(".blog-post__close");
          const content = article.querySelector(".blog-post__content");

          const closeArticle = () => {
            article.classList.remove("expanded");
            content.classList.add("collapsed");
            expandBtn.style.display = "block";
            readMoreBtn.style.display = "inline-block";
            closeBtn.style.display = "none";
            document.body.style.overflow = "";
          };

          expandBtn.addEventListener("click", () => {
            article.classList.add("expanded");
            content.classList.remove("collapsed");
            expandBtn.style.display = "none";
            readMoreBtn.style.display = "none";
            closeBtn.style.display = "block";
            document.body.style.overflow = "hidden";
            window.scrollTo(0, 0);
          });

          readMoreBtn.addEventListener("click", () => {
            article.classList.add("expanded");
            content.classList.remove("collapsed");
            expandBtn.style.display = "none";
            readMoreBtn.style.display = "none";
            closeBtn.style.display = "block";
            document.body.style.overflow = "hidden";
            window.scrollTo(0, 0);
          });

          closeBtn.addEventListener("click", closeArticle);

          // Add event listener for Escape key
          document.addEventListener("keydown", (event) => {
            if (
              event.key === "Escape" &&
              article.classList.contains("expanded")
            ) {
              closeArticle();
            }
          });

          container.appendChild(article);
        } catch (error) {
          console.error("Error loading blog posts:", error);
          container.innerHTML =
            "<p>Error loading blog posts. Please try again later.</p>";
        }
      }

      // Load blog posts when the page loads
      document.addEventListener("DOMContentLoaded", loadBlogPosts);
    </script>
  </body>
